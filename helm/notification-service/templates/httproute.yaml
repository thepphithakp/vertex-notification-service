{{- if .Values.httpRoute.enabled }}
{{- /*
HTTPRoute — เส้นทางจากภายนอกเข้า notification-service

⚠️ เปิดเฉพาะ path /api/v1/push (subscribe/unsubscribe ที่ PWA เรียก)
   /api/v1/internal/push/send ไม่เปิดออกนอกคลัสเตอร์โดยตั้งใจ — service อื่น
   เรียกผ่าน cluster-internal DNS (http://notification-service:{{ .Values.service.port }})
   เท่านั้น ไม่มีเหตุผลต้องให้คนนอกยิงถึง แม้จะมี service-token ป้องกันอยู่ก็ตาม
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "notification-service.fullname" . }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      {{- with .Values.httpRoute.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- if not .Values.httpRoute.hostnames }}
  {{- fail "ต้องส่ง httpRoute.hostnames ตอน deploy — ค่าจริงไม่เก็บใน repo ที่เป็น public" }}
  {{- end }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/push
      backendRefs:
        - name: {{ include "notification-service.fullname" $ }}
          port: {{ $.Values.service.port }}
{{- end }}
